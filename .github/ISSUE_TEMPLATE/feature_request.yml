name: Feature request
description: Suggest something holt should do, or do differently.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        holt stays small on purpose: zero runtime dependencies in the npm package, the minimum Chrome permissions, and captures that go only to your own server. Ideas that change any of those are welcome, but say why they are worth it.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and what got in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you'd like
      description: How it could work. Which part would change (server, Vite plugin, extension, notes.md format)?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: Anything you tried or considered instead.
