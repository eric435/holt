name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      # Fail if the packed tarball contains anything outside an explicit
      # allow-list (tests, source maps, a stray .env) or declares a runtime
      # dependency. See packages/server/scripts/check-pack.mjs.
      - name: Check published files
        run: pnpm --filter nitpick-notes check-pack
      # Load the built extension in a real headless Chrome and fail on any
      # startup error, forged-message acceptance, or storage leak.
      - name: Extension smoke test
        run: pnpm --filter @nitpick/extension smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
