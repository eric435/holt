<!doctype html>
<!--
  The side panel page. Extension pages are subject to Manifest V3's content
  security policy: no inline <script> and no inline event handlers, so all
  behaviour comes from sidepanel.js (built from src/sidepanel/index.ts).
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>holt</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <header class="app-header">
      <img src="icons/icon-32.png" alt="" width="20" height="20" />
      <h1>holt</h1>
    </header>
    <main>
      <section id="status" class="card"></section>
      <section id="entries" class="card"></section>
      <section id="settings" class="card"></section>
      <div id="shortcut-hint"></div>
    </main>
    <div id="toasts" class="toasts" aria-live="polite"></div>
  </body>
</html>
