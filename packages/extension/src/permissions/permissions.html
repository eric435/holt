<!doctype html>
<!--
  Opened in a normal tab when holt can't get microphone access: by the
  worker when a voice note fails to start with the panel closed, from the
  panel's "Grant microphone access" toast, or from Settings ("Grant access to
  see names"). Voice notes are recorded in an offscreen document, which is
  never visible and so can never show a permission prompt; a tab can. The
  permission belongs to the extension's origin (chrome-extension://<id>), so
  granting it here also unlocks the offscreen recorder and the side panel.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>holt: microphone access</title>
    <link rel="stylesheet" href="sidepanel.css" />
    <script type="module" src="permissions.js"></script>
  </head>
  <body>
    <main style="max-width: 520px; margin: 40px auto">
      <section class="card">
        <h2>Microphone access</h2>
        <p>holt records voice notes in the background, so they keep going with the side panel closed. Because that recorder is invisible, Chrome can't ask you there; allow the microphone for holt once on this page instead.</p>
        <button id="grant" class="big">Allow microphone</button>
        <p id="result" class="hint" role="status"></p>
      </section>
    </main>
  </body>
</html>
