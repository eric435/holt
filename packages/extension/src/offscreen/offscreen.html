<!doctype html>
<!--
  The offscreen document: a hidden extension page that hosts nitpick's
  recorders (tab capture and voice notes) so they survive the side panel
  being closed. It is never shown, so it has no UI; all behaviour comes from
  offscreen.js (built from src/offscreen/index.ts). Created and closed by the
  service worker, see src/background/offscreen.ts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nitpick recorder</title>
    <script type="module" src="offscreen.js"></script>
  </head>
  <body></body>
</html>
